[project]
name = "voice-agent-es"
version = "0.1.0"
description = "Rioplatense-Spanish banking support voice agent on ElevenLabs Agents, with a FastAPI tool backend and an eval suite."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.9",
    "pymysql>=1.2.4",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["backend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "N"]
ignore = ["E501"]  # line width is left to the formatter
