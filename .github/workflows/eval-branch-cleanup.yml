# Archives a pull request's ElevenLabs agent branch (pr-<number>) once the PR is merged or closed.
# Archived branches stay in the dashboard history; a reopened PR unarchives its branch.
name: Eval branch cleanup

on:
  pull_request:
    types: [closed]

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Archive the PR's agent branch
        run: uv run python -m scripts.agent_branch archive "pr-${{ github.event.pull_request.number }}"
